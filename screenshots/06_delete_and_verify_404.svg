<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#1e1e1e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Window Header -->
  <rect width="1000" height="40" fill="#252526"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  <text x="90" y="24" fill="#cccccc" font-size="12" font-weight="600">Postman — 02 - Booking Management / Delete &amp; Negative Verification (404 Not Found)</text>
  <rect x="750" y="8" width="230" height="24" rx="4" fill="#333333" stroke="#ff6c37" stroke-width="1"/>
  <text x="765" y="24" fill="#ffffff" font-size="11">Restful Booker - Production Env</text>

  <!-- Step 1: DELETE Request Box -->
  <g transform="translate(20, 55)">
    <rect width="960" height="235" rx="6" fill="#252526" stroke="#333333"/>
    
    <!-- Title banner -->
    <rect width="960" height="32" rx="6" fill="#2d2d30"/>
    <text x="16" y="21" fill="#e74c3c" font-size="12" font-weight="bold">BƯỚC 1: XÓA DỮ LIỆU (DELETE METHOD)</text>

    <!-- Request Row -->
    <g transform="translate(16, 45)">
      <rect width="65" height="28" rx="3" fill="#e74c3c"/>
      <text x="12" y="19" fill="#ffffff" font-size="11" font-weight="bold">DELETE</text>
      
      <rect x="75" y="0" width="600" height="28" rx="3" fill="#1e1e1e"/>
      <text x="85" y="18" fill="#ff6c37" font-size="11" font-family="monospace">{{base_url}}/booking/{{bookingId}}</text>
      <text x="320" y="18" fill="#888888" font-size="10" font-family="monospace">(Cookie: token={{token}})</text>

      <rect x="690" y="0" width="115" height="28" rx="3" fill="#1b3a24" stroke="#2ecc71" stroke-width="0.8"/>
      <circle cx="702" cy="14" r="4" fill="#2ecc71"/>
      <text x="712" y="18" fill="#2ecc71" font-size="11" font-weight="bold">201 Created</text>
      
      <text x="820" y="18" fill="#888888" font-size="11">Time: <tspan fill="#2ecc71">295 ms</tspan></text>
    </g>

    <!-- Response & Tests -->
    <g transform="translate(16, 90)">
      <rect width="440" height="120" rx="4" fill="#1e1e1e" stroke="#333333"/>
      <text x="14" y="24" fill="#888888" font-size="11">Response Body (Text):</text>
      <text x="14" y="55" fill="#2ecc71" font-family="monospace" font-size="14" font-weight="bold">"Created"</text>
      <text x="14" y="90" fill="#aaaaaa" font-size="10">(Restful Booker API trả về chuỗi "Created" báo hiệu xóa thành công)</text>

      <!-- Test badges -->
      <rect x="460" y="0" width="470" height="120" rx="4" fill="#1e1e1e" stroke="#333333"/>
      <g transform="translate(475, 25)">
        <rect width="45" height="20" rx="3" fill="#2ecc71"/>
        <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="bold">PASS</text>
        <text x="56" y="14" fill="#ffffff" font-size="11">Status code is 201 Created on successful deletion</text>
      </g>
      <g transform="translate(475, 65)">
        <rect width="45" height="20" rx="3" fill="#2ecc71"/>
        <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="bold">PASS</text>
        <text x="56" y="14" fill="#ffffff" font-size="11">Response body confirms deletion ("Created")</text>
      </g>
    </g>
  </g>

  <!-- Step 2: Negative Verification Box -->
  <g transform="translate(20, 310)">
    <rect width="960" height="260" rx="6" fill="#252526" stroke="#333333"/>
    
    <!-- Title banner -->
    <rect width="960" height="32" rx="6" fill="#2d2d30"/>
    <text x="16" y="21" fill="#3498db" font-size="12" font-weight="bold">BƯỚC 2: KIỂM THỬ TIÊU CỰC XÁC MINH DỮ LIỆU ĐÃ BỊ XÓA (VERIFY 404 NOT FOUND)</text>

    <!-- Request Row -->
    <g transform="translate(16, 45)">
      <rect width="65" height="28" rx="3" fill="#3498db"/>
      <text x="18" y="19" fill="#ffffff" font-size="11" font-weight="bold">GET</text>
      
      <rect x="75" y="0" width="600" height="28" rx="3" fill="#1e1e1e"/>
      <text x="85" y="18" fill="#ff6c37" font-size="11" font-family="monospace">{{base_url}}/booking/{{bookingId}}</text>
      <text x="320" y="18" fill="#888888" font-size="10" font-family="monospace">(Truy vấn lại ID 2418 vừa bị xóa)</text>

      <rect x="690" y="0" width="135" height="28" rx="3" fill="#3d2121" stroke="#e74c3c" stroke-width="0.8"/>
      <circle cx="702" cy="14" r="4" fill="#e74c3c"/>
      <text x="712" y="18" fill="#e74c3c" font-size="11" font-weight="bold">404 Not Found</text>
      
      <text x="840" y="18" fill="#888888" font-size="11">Time: <tspan fill="#2ecc71">245 ms</tspan></text>
    </g>

    <!-- Response & Tests -->
    <g transform="translate(16, 90)">
      <rect width="440" height="145" rx="4" fill="#1e1e1e" stroke="#333333"/>
      <text x="14" y="24" fill="#888888" font-size="11">Response Body (Text):</text>
      <text x="14" y="60" fill="#e74c3c" font-family="monospace" font-size="16" font-weight="bold">"Not Found"</text>
      <rect x="14" y="85" width="410" height="45" rx="3" fill="#2d2121"/>
      <text x="24" y="105" fill="#e74c3c" font-size="11" font-weight="bold">Kỳ vọng kiểm thử:</text>
      <text x="24" y="120" fill="#aaaaaa" font-size="10">Server phải từ chối tìm thấy tài nguyên và trả về đúng chuẩn HTTP 404.</text>

      <!-- Test badges -->
      <rect x="460" y="0" width="470" height="145" rx="4" fill="#1e1e1e" stroke="#333333"/>
      <g transform="translate(475, 25)">
        <rect width="45" height="20" rx="3" fill="#2ecc71"/>
        <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="bold">PASS</text>
        <text x="56" y="14" fill="#ffffff" font-size="11">Status code is 404 Not Found after deletion</text>
      </g>
      <g transform="translate(475, 65)">
        <rect width="45" height="20" rx="3" fill="#2ecc71"/>
        <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="bold">PASS</text>
        <text x="56" y="14" fill="#ffffff" font-size="11">Response body indicates Not Found</text>
      </g>

      <rect x="475" y="98" width="440" height="34" rx="3" fill="#1b2e24"/>
      <text x="490" y="119" fill="#2ecc71" font-size="11" font-weight="bold">✓ Negative Test Đạt: Dữ liệu đã thực sự được xóa khỏi Database.</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <rect y="590" width="1000" height="30" fill="#252526"/>
  <text x="20" y="610" fill="#888888" font-size="11">Console  •  Runner  •  Cookies  •  Capture requests</text>
  <text x="850" y="610" fill="#2ecc71" font-size="11" font-weight="bold">● All Tests Passed (4/4)</text>
</svg>
