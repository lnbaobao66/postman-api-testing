<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#1e1e1e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Window Header -->
  <rect width="1000" height="40" fill="#252526"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  <text x="90" y="24" fill="#cccccc" font-size="12" font-weight="600">Postman — 02 - Booking Management / Create New Booking (API Chaining)</text>
  <rect x="750" y="8" width="230" height="24" rx="4" fill="#333333" stroke="#ff6c37" stroke-width="1"/>
  <text x="765" y="24" fill="#ffffff" font-size="11">Restful Booker - Production Env</text>

  <!-- Request Header Bar -->
  <g transform="translate(20, 55)">
    <rect width="70" height="36" rx="4" fill="#2ecc71"/>
    <text x="14" y="23" fill="#ffffff" font-size="13" font-weight="bold">POST</text>

    <rect x="80" y="0" width="760" height="36" rx="4" fill="#2d2d30" stroke="#3e3e42"/>
    <text x="96" y="23" fill="#ff6c37" font-size="13" font-family="monospace">{{base_url}}</text>
    <text x="195" y="23" fill="#ffffff" font-size="13" font-family="monospace">/booking</text>

    <rect x="850" y="0" width="110" height="36" rx="4" fill="#097BED"/>
    <text x="888" y="23" fill="#ffffff" font-size="13" font-weight="bold">Send</text>
  </g>

  <!-- Request Tabs & Dynamic Payload -->
  <g transform="translate(20, 105)">
    <text x="0" y="16" fill="#888888" font-size="12">Params</text>
    <text x="65" y="16" fill="#888888" font-size="12">Authorization</text>
    <text x="165" y="16" fill="#888888" font-size="12">Headers (1)</text>
    <text x="250" y="16" fill="#ffffff" font-size="12" font-weight="bold">Body (raw JSON)</text>
    <rect x="250" y="25" width="95" height="2" fill="#ff6c37"/>
    <text x="365" y="16" fill="#ff6c37" font-size="12">Pre-request Script (1)</text>
    <circle cx="490" cy="12" r="3" fill="#ff6c37"/>
    <text x="510" y="16" fill="#888888" font-size="12">Tests (3)</text>
    <circle cx="563" cy="12" r="3" fill="#2ecc71"/>

    <!-- Payload Preview Box -->
    <rect x="0" y="35" width="960" height="110" rx="4" fill="#252526" stroke="#333333"/>
    <text x="15" y="55" fill="#888888" font-size="11">Dữ liệu gửi lên sử dụng Biến môi trường &amp; Dynamic Variables:</text>
    <text x="15" y="78" fill="#e5c07b" font-family="monospace" font-size="11">"firstname": <tspan fill="#ff6c37">"{{firstname}}"</tspan>, "lastname": <tspan fill="#ff6c37">"{{lastname}}"</tspan>, "totalprice": <tspan fill="#3498db">{{dynamic_price}}</tspan>, "depositpaid": <tspan fill="#98c379">true</tspan></text>
    <text x="15" y="98" fill="#e5c07b" font-family="monospace" font-size="11">"bookingdates": { "checkin": <tspan fill="#98c379">"2026-11-01"</tspan>, "checkout": <tspan fill="#98c379">"2026-11-10"</tspan> }, "additionalneeds": <tspan fill="#98c379">"Breakfast and Airport Shuttle"</tspan></text>
    <text x="15" y="125" fill="#2ecc71" font-size="11">✓ Pre-request Script: Đã tự động sinh giá ngẫu nhiên {{dynamic_price}} = 385 USD</text>
  </g>

  <!-- Response Section -->
  <g transform="translate(20, 275)">
    <text x="0" y="20" fill="#aaaaaa" font-size="12" font-weight="bold">RESPONSE</text>
    
    <g transform="translate(560, 4)">
      <rect width="110" height="24" rx="3" fill="#1b3a24" stroke="#2ecc71" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="4" fill="#2ecc71"/>
      <text x="24" y="16" fill="#2ecc71" font-size="11" font-weight="bold">200 OK</text>

      <rect x="120" y="0" width="130" height="24" rx="3" fill="#2d2d30"/>
      <text x="130" y="16" fill="#888888" font-size="11">Time: <tspan fill="#2ecc71" font-weight="bold">385 ms</tspan></text>

      <rect x="260" y="0" width="140" height="24" rx="3" fill="#2d2d30"/>
      <text x="270" y="16" fill="#888888" font-size="11">Size: <tspan fill="#cccccc">296 B</tspan></text>
    </g>

    <!-- Response Tabs -->
    <text x="0" y="55" fill="#888888" font-size="12">Body</text>
    <text x="50" y="55" fill="#888888" font-size="12">Cookies</text>
    <text x="115" y="55" fill="#888888" font-size="12">Headers</text>
    <text x="180" y="55" fill="#ffffff" font-size="12" font-weight="bold">Test Results (3/3)</text>
    <rect x="180" y="65" width="105" height="2" fill="#2ecc71"/>

    <!-- Left Box: Response Body JSON with bookingid -->
    <rect x="0" y="75" width="450" height="215" rx="4" fill="#252526" stroke="#333333"/>
    <text x="15" y="98" fill="#888888" font-size="11">Pretty • JSON</text>
    <text x="15" y="122" fill="#e06c75" font-family="monospace" font-size="11">{</text>
    <text x="30" y="140" fill="#e5c07b" font-family="monospace" font-size="11">"bookingid"<tspan fill="#cccccc">: </tspan><tspan fill="#f1c40f" font-weight="bold">2418</tspan><tspan fill="#cccccc">,</tspan></text>
    <text x="30" y="158" fill="#e5c07b" font-family="monospace" font-size="11">"booking"<tspan fill="#cccccc">: {</tspan></text>
    <text x="45" y="176" fill="#e5c07b" font-family="monospace" font-size="11">"firstname"<tspan fill="#cccccc">: </tspan><tspan fill="#98c379">"Alex"</tspan><tspan fill="#cccccc">, </tspan><tspan fill="#e5c07b">"lastname"</tspan><tspan fill="#cccccc">: </tspan><tspan fill="#98c379">"Miller"</tspan><tspan fill="#cccccc">,</tspan></text>
    <text x="45" y="194" fill="#e5c07b" font-family="monospace" font-size="11">"totalprice"<tspan fill="#cccccc">: </tspan><tspan fill="#3498db">385</tspan><tspan fill="#cccccc">, </tspan><tspan fill="#e5c07b">"depositpaid"</tspan><tspan fill="#cccccc">: </tspan><tspan fill="#98c379">true</tspan></text>
    <text x="30" y="212" fill="#cccccc" font-family="monospace" font-size="11">}</text>
    <text x="15" y="230" fill="#e06c75" font-family="monospace" font-size="11">}</text>
    
    <!-- Extraction banner -->
    <rect x="15" y="240" width="420" height="40" rx="4" fill="#1b2e24" stroke="#2ecc71" stroke-width="0.8"/>
    <text x="25" y="258" fill="#2ecc71" font-size="11" font-weight="bold">✓ API Chaining trích xuất thành công:</text>
    <text x="25" y="272" fill="#ffffff" font-size="10" font-family="monospace">pm.environment.set("bookingId", 2418);</text>

    <!-- Right Box: Test Results Passed (3/3) -->
    <rect x="470" y="75" width="490" height="215" rx="4" fill="#252526" stroke="#333333"/>
    
    <g transform="translate(485, 100)">
      <rect width="45" height="20" rx="3" fill="#2ecc71"/>
      <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="bold">PASS</text>
      <text x="56" y="14" fill="#ffffff" font-size="12">Status code is 200 OK</text>
    </g>

    <g transform="translate(485, 140)">
      <rect width="45" height="20" rx="3" fill="#2ecc71"/>
      <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="bold">PASS</text>
      <text x="56" y="14" fill="#ffffff" font-size="12">Response contains bookingid and booking object</text>
    </g>

    <g transform="translate(485, 180)">
      <rect width="45" height="20" rx="3" fill="#2ecc71"/>
      <text x="8" y="14" fill="#ffffff" font-size="10" font-weight="bold">PASS</text>
      <text x="56" y="14" fill="#ffffff" font-size="12">Booking details match submitted data (Alex Miller)</text>
    </g>

    <!-- Console Log Box -->
    <rect x="485" y="220" width="460" height="55" rx="4" fill="#1b1d21"/>
    <text x="500" y="238" fill="#888888" font-size="10" font-family="monospace">> Postman Console:</text>
    <text x="500" y="255" fill="#2ecc71" font-size="10" font-family="monospace">Generated dynamic totalprice: 385</text>
    <text x="500" y="268" fill="#f1c40f" font-size="10" font-family="monospace">Saved new Booking ID to Environment: 2418</text>
  </g>

  <!-- Bottom Bar -->
  <rect y="610" width="1000" height="30" fill="#252526"/>
  <text x="20" y="630" fill="#888888" font-size="11">Console  •  Runner  •  Cookies  •  Capture requests</text>
  <text x="850" y="630" fill="#2ecc71" font-size="11" font-weight="bold">● All Tests Passed (3/3)</text>
</svg>
